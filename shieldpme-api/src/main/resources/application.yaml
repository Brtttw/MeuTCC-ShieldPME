spring:
  application:
    name: shieldpme-api

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ShieldPME;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Configuracoes sensiveis vem SEMPRE de variaveis de ambiente (nunca versionar valores reais).
app:
  jwt:
    # Obrigatorio: minimo de 32 caracteres. Gere com: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # Diretorio PRIVADO (fora de qualquer pasta servida). Nao e exposto como recurso estatico.
    reports-dir: ${REPORTS_DIR:./storage/reports}
    max-report-bytes: 10485760
